  <style>
    :root {
      --ink: #1c1a16; --ink-soft: #3a342c; --muted: #6b6358;
      --olive: #5c6b3a; --olive-deep: #45522c; --primary: #e8943a;
      --paper: #f7f1e6; --paper-deep: #ebe3d4; --card: #fffdf8;
      --border: #e0d6c6; --danger: #9a3412; --ok: #3f6212;
      --kill: #9a3412; --keep: #3f6212;
      --shadow: 0 0 0 1px rgba(28,26,22,.06), 0 8px 24px rgba(28,26,22,.06);
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .mock-banner { background: #2f3a22; color: #e8efd8; font-size: .85rem; padding: .6rem 1.25rem; text-align: center; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
    a { color: var(--olive); }
    .wrap { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 0; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; text-decoration: none; color: var(--ink); }
    .logo-img { height: 2rem; width: auto; display: block; }
    .nav { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .nav a { font-size: .875rem; color: var(--muted); text-decoration: none; margin-left: .35rem; }
    .nav a:hover { color: var(--ink); }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: .5rem; overflow: hidden; background: var(--card); flex-wrap: wrap; }
    .lang button { border: 0; background: transparent; padding: .35rem .5rem; font: inherit; font-size: .72rem; font-weight: 700; color: var(--muted); cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .badge { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--olive); margin: 0 0 .75rem; }
    h1 { font-family: var(--font); font-weight: 500; font-size: clamp(1.55rem, 4vw, 2.15rem); letter-spacing: -.02em; line-height: 1.15; margin: .4rem 0 0; }
    .sub { margin: .55rem 0 0; color: var(--muted); font-size: .92rem; max-width: 40rem; }
    .lead { margin: .85rem 0 1.35rem; color: var(--ink-soft); max-width: 40rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: .85rem;
      padding: 1.1rem 1.15rem; margin: 0 0 1rem; box-shadow: var(--shadow);
    }
    .card h2 { font-family: var(--font); font-weight: 500; font-size: 1.15rem; margin: 0 0 .75rem; color: var(--ink); }
    .prem-list { margin: 0; padding: 0; list-style: none; counter-reset: prem; }
    .prem-list li {
      counter-increment: prem; position: relative;
      padding: .45rem 0 .45rem 2.4rem; font-size: .92rem; color: var(--ink-soft);
      border-bottom: 1px solid var(--border);
    }
    .prem-list li:last-child { border-bottom: 0; }
    .prem-list li::before {
      content: counter(prem); position: absolute; left: 0; top: .4rem;
      width: 1.55rem; height: 1.55rem; border-radius: 999px; background: var(--olive); color: #f4f7ec;
      font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .hint { margin: 0 0 .75rem; font-size: .88rem; color: var(--muted); }
    label { display: block; font-size: .8rem; color: var(--muted); margin-top: .55rem; font-weight: 600; }
    input[type=number], select {
      width: 100%; max-width: 160px; padding: .45rem .55rem;
      border-radius: .5rem; border: 1px solid var(--border);
      background: var(--paper); color: var(--ink); font: inherit;
    }
    .row { display: flex; flex-wrap: wrap; gap: .85rem; align-items: end; }
    button#run {
      margin-top: 1rem; background: var(--primary); color: #1a1208;
      border: 0; border-radius: .55rem; padding: .65rem 1.2rem;
      font-weight: 650; font: inherit; font-size: .95rem; cursor: pointer;
    }
    button#run:hover { filter: brightness(1.05); }
    .verdict {
      border-left: 4px solid var(--kill); padding: .7rem .9rem; margin: .65rem 0;
      background: #fceee8; border-radius: 0 .55rem .55rem 0; font-size: .9rem;
    }
    .verdict.keep { border-left-color: var(--keep); background: #f0f5e6; }
    .tag { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .tag.kill { color: var(--kill); }
    .tag.keep { color: var(--keep); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; color: var(--ink-soft); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; margin: .75rem 0; }
    th, td { text-align: left; padding: .4rem .35rem; border-bottom: 1px solid var(--border); }
    th { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    footer { margin-top: 1.75rem; color: var(--muted); font-size: .82rem; }
    footer a { margin: 0 .15rem; }
    .empty { color: var(--muted); font-size: .92rem; }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body data-lang="en">
  <div class="mock-banner" data-i18n="banner"></div>
  <div class="wrap">
    <header>
      <a class="brand" href="index.html"><img class="logo-img" src="logo-header.png" alt="FoodAllo" width="156" height="48" /></a>
      <nav class="nav" aria-label="Navigation">
        <a href="index.html" data-i18n="nav_home"></a>
        <a href="demo.html" data-i18n="nav_demo"></a>
        <a href="analog.html" data-i18n="nav_analog"></a>
</nav>
    </header>

    <main>
      <p class="badge" data-i18n="badge"></p>
      <h1 data-i18n="h1"></h1>
      <p class="sub" data-i18n="subtitle"></p>
      <p class="lead" data-i18n="lead"></p>

      <div class="card">
        <h2 data-i18n="prem_h"></h2>
        <p class="hint" data-i18n="prem_hint"></p>
        <ol class="prem-list" id="premises"></ol>
      </div>

      <div class="card">
        <h2 data-i18n="scen_h"></h2>
        <p class="hint" data-i18n="scen_hint"></p>
        <div class="row">
          <div>
            <label for="stock" data-i18n="lbl_stock"></label>
            <input id="stock" type="number" min="1" max="100" value="10"/>
          </div>
          <div>
            <label for="need" data-i18n="lbl_need"></label>
            <input id="need" type="number" min="1" max="50" value="4"/>
          </div>
          <div>
            <label for="scenario" data-i18n="lbl_scenario"></label>
            <select id="scenario">
              <option value="knappheit" data-i18n-opt="opt_knapp"></option>
              <option value="schock" data-i18n-opt="opt_schock"></option>
            </select>
          </div>
        </div>
        <button type="button" id="run" data-i18n="btn_run"></button>
      </div>

      <div class="card">
        <h2 data-i18n="out_h"></h2>
        <div id="out" class="empty" data-i18n="out_empty"></div>
      </div>

      <footer>
        <span data-i18n="footer_note"></span>
        <a href="index.html" data-i18n="nav_home"></a> ·
        <a href="demo.html" data-i18n="nav_demo"></a> ·
        <a href="analog.html" data-i18n="nav_analog"></a>
      </footer>
    </main>
  </div>
<script>
(function () {
  var I18N = {
    en: {
      "title": "FoodAllo — Why other paths fail",
      "banner": "FoodAllo · Fair allocation of food and essentials · Public interest",
      "nav_home": "Home",
      "nav_demo": "Try FoodAllo",
      "nav_analog": "No smartphone",
      "badge": "How it works",
      "h1": "Why other paths fail",
      "subtitle": "Under scarcity, which allocation rules hold? Compare common alternatives side by side.",
      "lead": "Under clear premises we run common alternatives to the end: most fail — a fair need-based allotment remains possible.",
      "prem_h": "Premises (plain language)",
      "prem_hint": "If you reject a premise, the conclusion does not hold for that premise.",
      "prem1": "Equal dignity: no one may go empty because of money, speed, or chance.",
      "prem2": "Real scarcity: there is less food than everyone needs.",
      "prem3": "The market does not help here — it has failed or is unfair.",
      "prem4": "Stock in a warehouse is not the same as who gets it.",
      "prem5": "Only what is actually there may be promised.",
      "prem6": "Offline and analogue count the same.",
      "prem7": "Aid and donations complement the rule — they do not replace it.",
      "scen_h": "Set the scenario",
      "scen_hint": "Four people with equal need. Stock below total = real scarcity.",
      "lbl_stock": "Food stock",
      "lbl_need": "Need per person",
      "lbl_scenario": "Scenario",
      "opt_knapp": "Food scarcity",
      "opt_schock": "Wealth shock",
      "btn_run": "Start comparison",
      "out_h": "Result",
      "out_empty": "No comparison yet — click “Start comparison”.",
      "footer_note": "FoodAllo · free · public interest · ready to use · ",
      "th_person": "Person",
      "th_wealth": "Purchasing power",
      "th_speed": "Speed",
      "th_digital": "digital",
      "yes": "yes",
      "no": "no",
      "scen_knapp_label": "Food scarcity, market disrupted",
      "scen_schock_label": "Wealth shock (purchasing power collapses)",
      "head_stock": "Stock {stock}, need each {need}, total {total}.",
      "scarcity_yes": "Real scarcity.",
      "scarcity_no": "No scarcity pressure — premise 2 is weaker.",
      "tag_fail": "Fails",
      "tag_ok": "Remains possible",
      "tag_end": "Conclusion",
      "fail_because": "fails because {reason}",
      "ok_because": "remains possible because {reason}",
      "under_need": "below full need: {ids}",
      "allot": "Allotment {got} · fully served: {ok}/{n}",
      "end_failed": "Fail: {list}",
      "end_kept": "Remain: {list}",
      "end_note": "Under the premises, a ruled need-based allotment remains. Rejection = drop at least one premise.",
      "name_price": "Price / purchasing power",
      "name_first": "First come",
      "name_arb": "Arbitrary / connections",
      "name_reserve": "Warehouse only (no allotment)",
      "name_aid": "Aid only without a rule",
      "name_over": "Promises above stock",
      "name_core": "FoodAllo core (need-based allotment)",
      "reason_price": "The poor drop out first — even with the same hunger.",
      "reason_first": "Whoever is slower or offline loses.",
      "reason_arb": "Without a published rule, exclusion cannot be checked.",
      "reason_reserve": "Stock {stock} stays undistributed. Warehouse without a rule does not say who gets it.",
      "reason_aid": "Help without a fair mechanism stays piecemeal.",
      "reason_over": "Promised {promised}, available {stock}.",
      "reason_core": "Allotment from stock {stock}: equal base shares, remainder round-robin — checkable and need-based."
    }
  };

  var cur = "en";
  var q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) cur = q;

  function t(k) {
    return (I18N[cur] || I18N.en)[k] != null ? (I18N[cur] || I18N.en)[k] : (I18N.en[k] || k);
  }
  function fill(tpl, map) {
    return String(tpl).replace(/\{(\w+)\}/g, function (_, k) { return map[k] != null ? map[k] : ""; });
  }

  function renderPremises() {
    var html = "";
    for (var i = 1; i <= 7; i++) {
      html += "<li>" + t("prem" + i) + "</li>";
    }
    document.getElementById("premises").innerHTML = html;
  }

  function applyStatic() {
    document.body.setAttribute("data-lang", cur);
    document.documentElement.lang = cur === "uk" ? "uk" : cur;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-opt]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n-opt"));
    });
    document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn") === cur ? "true" : "false");
    });
    renderPremises();
  }

  /* —— allocation logic (unchanged mechanics) —— */
  function claims(need, scenario) {
    if (scenario === "schock") {
      return [
        { id: "A", need: need, wealth: 12, speed: 1, digital: true },
        { id: "B", need: need, wealth: 8, speed: 3, digital: false },
        { id: "C", need: need, wealth: 15, speed: 2, digital: true },
        { id: "D", need: need, wealth: 5, speed: 4, digital: true }
      ];
    }
    return [
      { id: "A", need: need, wealth: 90, speed: 1, digital: true },
      { id: "B", need: need, wealth: 10, speed: 3, digital: false },
      { id: "C", need: need, wealth: 70, speed: 2, digital: true },
      { id: "D", need: need, wealth: 20, speed: 4, digital: true }
    ];
  }

  function allocateBy(list, stock, need, orderFn) {
    var ordered = list.slice().sort(orderFn);
    var got = {};
    list.forEach(function (p) { got[p.id] = 0; });
    var left = stock;
    var excluded = [];
    for (var i = 0; i < ordered.length; i++) {
      var p = ordered[i];
      var take = Math.min(need, left);
      got[p.id] = take;
      left -= take;
      if (take < need) excluded.push(p.id);
    }
    var ok = list.filter(function (p) { return got[p.id] >= need; }).length;
    return { got: got, excluded: excluded, ok: ok };
  }

  function runPrice(list, stock, need) {
    var r = allocateBy(list, stock, need, function (a, b) {
      return b.wealth - a.wealth || a.id.localeCompare(b.id);
    });
    return { key: "price", kill: true, broken: ["P1", "P3"], reasonKey: "reason_price", reasonMap: {}, got: r.got, excluded: r.excluded, ok: r.ok };
  }
  function runFirst(list, stock, need) {
    var r = allocateBy(list, stock, need, function (a, b) {
      return a.speed - b.speed || a.id.localeCompare(b.id);
    });
    return { key: "first", kill: true, broken: ["P1", "P6"], reasonKey: "reason_first", reasonMap: {}, got: r.got, excluded: r.excluded, ok: r.ok };
  }
  function runArbitrary(list, stock, need) {
    var fav = ["A", "C"];
    var got = {};
    list.forEach(function (p) { got[p.id] = 0; });
    var left = stock;
    for (var i = 0; i < fav.length; i++) {
      var id = fav[i];
      var take = Math.min(need, left);
      got[id] = take;
      left -= take;
    }
    var excluded = list.filter(function (p) { return got[p.id] < need; }).map(function (p) { return p.id; });
    return {
      key: "arb", kill: true, broken: ["P1"], reasonKey: "reason_arb", reasonMap: {},
      got: got, excluded: excluded,
      ok: list.filter(function (p) { return got[p.id] >= need; }).length
    };
  }
  function runReserve(list, stock) {
    var got = {};
    list.forEach(function (p) { got[p.id] = 0; });
    return {
      key: "reserve", kill: true, broken: ["P2", "P4"], reasonKey: "reason_reserve", reasonMap: { stock: stock },
      got: got, excluded: list.map(function (p) { return p.id; }), ok: 0
    };
  }
  function runAid(list, stock, need) {
    var aid = Math.max(1, Math.floor(stock / 4));
    var sorted = list.slice().sort(function (a, b) { return a.id.localeCompare(b.id); });
    var r = allocateBy(sorted, aid, need, function (a, b) { return a.id.localeCompare(b.id); });
    return { key: "aid", kill: true, broken: ["P1", "P7"], reasonKey: "reason_aid", reasonMap: {}, got: r.got, excluded: r.excluded, ok: r.ok };
  }
  function runOver(list, stock, need) {
    var promised = need * list.length;
    var got = {};
    list.forEach(function (p) { got[p.id] = 0; });
    return {
      key: "over", kill: true, broken: ["P5"], reasonKey: "reason_over", reasonMap: { promised: promised, stock: stock },
      got: got, excluded: list.map(function (p) { return p.id; }), ok: 0
    };
  }
  function runCore(list, stock, need) {
    var n = list.length;
    var base = Math.floor(stock / n);
    var order = list.slice().sort(function (a, b) { return a.id.localeCompare(b.id); });
    var got = {};
    list.forEach(function (p) { got[p.id] = 0; });
    for (var i = 0; i < order.length; i++) got[order[i].id] = Math.min(base, need);
    var left = stock - Object.keys(got).reduce(function (a, k) { return a + got[k]; }, 0);
    var guard = 0;
    while (left > 0 && guard < stock + 5) {
      var progressed = false;
      for (var j = 0; j < order.length; j++) {
        if (left <= 0) break;
        var p = order[j];
        if (got[p.id] < need) { got[p.id]++; left--; progressed = true; }
      }
      if (!progressed) break;
      guard++;
    }
    var excluded = list.filter(function (p) { return got[p.id] < need; }).map(function (p) { return p.id; });
    return {
      key: "core", kill: false, broken: [], reasonKey: "reason_core", reasonMap: { stock: stock },
      got: got, excluded: excluded,
      ok: list.filter(function (p) { return got[p.id] >= Math.min(base, need); }).length
    };
  }

  var NAME_KEYS = {
    price: "name_price", first: "name_first", arb: "name_arb",
    reserve: "name_reserve", aid: "name_aid", over: "name_over", core: "name_core"
  };

  function renderVerdict(v) {
    var cls = v.kill ? "verdict" : "verdict keep";
    var tag = v.kill
      ? '<span class="tag kill">' + t("tag_fail") + "</span>"
      : '<span class="tag keep">' + t("tag_ok") + "</span>";
    var name = t(NAME_KEYS[v.key]);
    var reason = fill(t(v.reasonKey), v.reasonMap);
    var because = fill(t(v.kill ? "fail_because" : "ok_because"), { reason: reason });
    var ex = v.excluded.length
      ? "<div>" + fill(t("under_need"), { ids: v.excluded.join(", ") }) + "</div>"
      : "";
    var allot = fill(t("allot"), {
      got: JSON.stringify(v.got),
      ok: v.ok,
      n: Object.keys(v.got).length
    });
    return '<div class="' + cls + '">' + tag + " <strong>" + name + "</strong>" +
      "<div>" + because + "</div>" +
      '<div class="mono">' + allot + "</div>" +
      ex + "</div>";
  }

  var lastRan = false;

  function run() {
    var stock = Math.max(1, parseInt(document.getElementById("stock").value, 10) || 10);
    var need = Math.max(1, parseInt(document.getElementById("need").value, 10) || 4);
    var scenario = document.getElementById("scenario").value;
    var list = claims(need, scenario);
    var scenLabel = scenario === "schock" ? t("scen_schock_label") : t("scen_knapp_label");
    var totalNeed = need * list.length;
    var tests = [
      runPrice(list, stock, need),
      runFirst(list, stock, need),
      runArbitrary(list, stock, need),
      runReserve(list, stock),
      runAid(list, stock, need),
      runOver(list, stock, need),
      runCore(list, stock, need)
    ];
    var killed = tests.filter(function (x) { return x.kill; }).map(function (x) { return t(NAME_KEYS[x.key]); });
    var kept = tests.filter(function (x) { return !x.kill; }).map(function (x) { return t(NAME_KEYS[x.key]); });
    var scarcity = stock < totalNeed ? t("scarcity_yes") : t("scarcity_no");
    var head = "<p><strong>" + scenLabel + ".</strong> " +
      fill(t("head_stock"), { stock: stock, need: need, total: totalNeed }) + " " + scarcity + "</p>" +
      "<table><thead><tr><th>" + t("th_person") + "</th><th>" + t("th_wealth") + "</th><th>" + t("th_speed") + "</th><th>" + t("th_digital") + "</th></tr></thead><tbody>" +
      list.map(function (p) {
        return "<tr><td>" + p.id + "</td><td>" + p.wealth + "</td><td>" + p.speed + "</td><td>" + (p.digital ? t("yes") : t("no")) + "</td></tr>";
      }).join("") +
      "</tbody></table>";
    var foot = '<div class="verdict keep" style="margin-top:1rem">' +
      '<span class="tag keep">' + t("tag_end") + "</span>" +
      "<div>" + fill(t("end_failed"), { list: killed.join("; ") }) + "</div>" +
      "<div>" + fill(t("end_kept"), { list: kept.join("; ") || "—" }) + "</div>" +
      '<div style="margin-top:.4rem">' + t("end_note") + "</div></div>";
    var out = document.getElementById("out");
    out.className = "";
    out.innerHTML = head + tests.map(renderVerdict).join("") + foot;
    lastRan = true;
  }

  function apply() {
    applyStatic();
    if (lastRan) run();
  }

  document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
    b.addEventListener("click", function () {
      cur = b.getAttribute("data-lang-btn");
      apply();
    });
  });
  document.getElementById("run").addEventListener("click", run);

  applyStatic();
})();
</script>
