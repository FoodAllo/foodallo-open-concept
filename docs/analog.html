<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodAllo — Ohne Smartphone</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="description" content="Desk, neighbour, paper code — same maximum shares without a smartphone. FoodAllo." />
  <meta name="theme-color" content="#F6A959" />
  <style>
    :root {
      --ink: #1c1a16; --ink-soft: #3a342c; --muted: #6b6358;
      --olive: #5c6b3a; --olive-deep: #45522c; --primary: #e8943a;
      --paper: #f7f1e6; --paper-deep: #ebe3d4; --card: #fffdf8;
      --border: #e0d6c6; --ok: #3f6212;
      --shadow: 0 0 0 1px rgba(28,26,22,.06), 0 8px 24px rgba(28,26,22,.06);
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .mock-banner { background: #2f3a22; color: #e8efd8; font-size: .85rem; padding: .6rem 1.25rem; text-align: center; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
    a { color: var(--olive); }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 0; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; text-decoration: none; color: var(--ink); }
    .logo-img { height: 2rem; width: auto; display: block; }
    .nav { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .nav a { font-size: .875rem; color: var(--muted); text-decoration: none; margin-left: .35rem; }
    .nav a:hover { color: var(--ink); }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: .5rem; overflow: hidden; background: var(--card); }
    .lang button { border: 0; background: transparent; padding: .35rem .5rem; font: inherit; font-size: .72rem; font-weight: 700; color: var(--muted); cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .badge { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--olive); margin: 0 0 .75rem; }
    h1 { font-family: var(--font); font-weight: 500; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.02em; line-height: 1.15; margin: .4rem 0 0; }
    .lead { margin: .85rem 0 1.5rem; color: var(--ink-soft); }
    ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }
    ol.steps li {
      counter-increment: step; position: relative;
      background: var(--card); border: 1px solid var(--border); border-radius: .65rem;
      padding: 1rem 1rem 1rem 3.1rem; margin: 0 0 .75rem; box-shadow: var(--shadow);
    }
    ol.steps li::before {
      content: counter(step); position: absolute; left: .85rem; top: .95rem;
      width: 1.6rem; height: 1.6rem; border-radius: 999px; background: var(--olive); color: #f4f7ec;
      font-size: .8rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .rule {
      margin: 1.5rem 0; padding: 1rem 1.1rem; border-radius: .65rem;
      background: #f0f5e6; border: 1px solid #c5d4a8; color: var(--ok); font-size: .95rem;
    }
    .note { font-size: .85rem; color: var(--muted); margin-top: 2rem; }
    .cta { display: inline-block; margin-top: 1.25rem; padding: .7rem 1.1rem; border-radius: .55rem;
      background: var(--olive); color: #f4f7ec; text-decoration: none; font-weight: 600; font-size: .9rem; }
    .cta:hover { background: var(--olive-deep); }
    :focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
  </style>
</head>
<body data-lang="en">
  <div class="mock-banner" data-i18n="banner"></div>
  <div class="wrap">
    <header>
      <a class="brand" href="index.html"><img class="logo-img" src="logo-header.png" alt="FoodAllo" width="156" height="48" /></a>
      <nav class="nav" aria-label="Navigation">
        <a href="index.html" data-i18n="nav_start"></a>
        <a href="demo.html?preset=markt" data-i18n="nav_demo"></a>
        <a href="eliminationsmaschine.html" data-i18n="nav_elim"></a>
</nav>
    </header>

    <main id="main">
      <p class="badge" data-i18n="badge"></p>
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="rule" role="note" data-i18n="rule"></div>
      <ol class="steps">
        <li><strong data-i18n="s1_t"></strong> — <span data-i18n="s1_b"></span></li>
        <li><strong data-i18n="s2_t"></strong> — <span data-i18n="s2_b"></span></li>
        <li><strong data-i18n="s3_t"></strong> — <span data-i18n="s3_b"></span></li>
      </ol>
      <a class="cta" href="demo.html?preset=markt" data-i18n="cta"></a>
      <p class="note" data-i18n="note"></p>
    </main>
  </div>
  <script>
(function(){
  var I18N = {
  "en": {"banner": "FoodAllo · Fair allocation of food and essentials · Public interest", "nav_start": "Home", "nav_demo": "Try FoodAllo", "nav_elim": "Elimination engine", "badge": "No smartphone", "h1": "Three ways without a smartphone", "lead": "Same rules as in the app. No extra share. Only different pickup paths.", "rule": "One card per household per week. The maximum share applies everywhere — desk, neighbour, paper code.", "s1_t": "Desk / counter", "s1_b": "You go to a municipal or store counter. Staff checks entitlement and records the maximum share.", "s2_t": "Neighbour / proxy", "s2_b": "A trusted person picks up for you. Same card — no second quota.", "s3_t": "Paper code", "s3_b": "You get a short code on paper. One-time use, short validity — then pickup like at the desk.", "cta": "Start allocation — fair vs first come", "note": "Public interest · Free · Ready to deploy · Same rules on every channel", "title": "FoodAllo — No smartphone"}
  };
  var cur = "en";
  var q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) cur = q;
  function t(k){ return (I18N[cur]||I18N.en)[k] || I18N.en[k] || k; }
  function apply(){
    document.body.setAttribute("data-lang", cur);
    document.documentElement.lang = cur === "uk" ? "uk" : cur;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-lang-btn]").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn")===cur ? "true":"false");
    });
  }
  document.querySelectorAll("[data-lang-btn]").forEach(function(b){
    b.addEventListener("click", function(){ cur = b.getAttribute("data-lang-btn"); apply(); });
  });
  apply();
})();
  </script>
</body>
</html>
