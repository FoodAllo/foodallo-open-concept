  <style>
    :root {

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
    a { color: var(--olive); }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 0; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; text-decoration: none; color: var(--ink); }
    .logo-img { height: 2rem; width: auto; display: block; }
    .nav { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
    .nav a { font-size: .875rem; color: var(--muted); text-decoration: none; }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: .5rem; overflow: hidden; background: var(--card); flex-wrap: wrap; }
    .lang button { border: 0; background: transparent; padding: .4rem .55rem; font: inherit; font-size: .72rem; font-weight: 700; color: var(--muted); cursor: pointer; letter-spacing: .02em; }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

    h1 { font-family: var(--font); font-weight: 500; font-size: clamp(1.75rem, 4vw, 2.6rem); letter-spacing: -.02em; line-height: 1.15; margin: .4rem 0 0; }

    @media (min-width: 720px) { .walk-steps { grid-template-columns: repeat(3, 1fr); } }

      counter-increment: walk; position: relative;
      background: var(--card); border: 1px solid var(--border); border-radius: .85rem;
      padding: 1rem 1rem 1rem 3.1rem; box-shadow: var(--shadow); font-size: .92rem; color: var(--ink-soft);
    }
    .walk-step::before {
      content: counter(walk); position: absolute; left: .85rem; top: .95rem;
      width: 1.7rem; height: 1.7rem; border-radius: 999px; background: var(--olive); color: #f4f7ec;
      font-size: .85rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .walk-step strong { display: block; color: var(--ink); margin-bottom: .25rem; font-size: .95rem; }
    .toggle { display: inline-flex; margin: 1.5rem 0 1rem; border: 1px solid var(--border); border-radius: .75rem; overflow: hidden; background: var(--card); flex-wrap: wrap; }
    .toggle button {
      border: 0; background: transparent; padding: 1rem 1.35rem; font: inherit;
      font-size: 1.05rem; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 3.25rem;
    }
    .toggle button[aria-pressed="true"] { background: var(--olive); color: #f4f7ec; }
    .callout { padding: .9rem 1.05rem; border-radius: .65rem; border: 1px solid var(--border); margin: 0 0 1.25rem; font-size: .92rem; }
    .callout.fair { background: #f0f5e6; border-color: #c5d4a8; color: var(--ok); }
    .callout.first { background: #fceee8; border-color: #e8c4b4; color: var(--danger); }
    .ticker { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.5rem; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; padding: .45rem .65rem; border-radius: .45rem; background: var(--paper-deep); border: 1px solid var(--border); }
    .chip strong { color: var(--danger); }
    .grid { display: grid; gap: 1rem; }
    @media (min-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: .85rem; padding: 1.1rem 1.15rem; box-shadow: var(--shadow); }
    .card h2 { font-family: var(--font); font-weight: 500; font-size: 1.2rem; margin: 0 0 .85rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .45rem .35rem; border-bottom: 1px solid var(--border); }
    th { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    td.granted { font-weight: 600; color: var(--olive-deep); }
    td.zero { color: var(--danger); font-weight: 600; }
    .stock { margin: 1.5rem 0; }
    .stock h3 { font-family: var(--font); font-weight: 500; font-size: 1.15rem; margin: 0 0 .75rem; }
    .rules { margin: 1.25rem 0 2rem; padding: 1rem 1.15rem; background: var(--card); border-radius: .75rem; border: 1px solid var(--border); }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 2.5rem; }
    .btn { display: inline-flex; align-items: center; height: 2.75rem; padding: 0 1.05rem; border-radius: .55rem; font-weight: 600; font-size: .9rem; text-decoration: none; border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
    .btn-primary { background: var(--primary); border-color: transparent; color: #1a1208; }
    .fine { font-size: .82rem; color: var(--muted); margin: 0 0 2rem; }
    .skip { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    .skip:focus {
      left: 1rem; top: 1rem; width: auto; height: auto; z-index: 20;
      padding: .55rem .85rem; background: var(--ink); color: var(--paper);
      border-radius: .4rem; text-decoration: none; font-size: .85rem; font-weight: 600;
    }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .btn:focus:not(:focus-visible), .toggle button:focus:not(:focus-visible),
    .lang button:focus:not(:focus-visible), .scenario button:focus:not(:focus-visible) { outline: none; }
    .hint {
      margin: 0 0 1.25rem; padding: .85rem 1.05rem; border-radius: .65rem;
      background: #f3efe6; border: 1px dashed var(--border); font-size: .9rem; color: var(--ink-soft);
    }
    .hint strong { color: var(--ink); }
    td.cap { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right;
      font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
    .rules ol { margin: .5rem 0 0; padding-left: 1.25rem; color: var(--ink-soft); font-size: .9rem; }
    .rules li { margin: .25rem 0; }
    .offline {
      margin: 1rem 0 0; padding: .85rem 1.05rem; border-radius: .65rem;
      border: 1px solid #c5d4a8; background: #f0f5e6; font-size: .88rem; color: var(--ok);
    }
    caption {
      text-align: left; font-size: .75rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: .35rem;
    }
    .policy { margin: 0 0 .55rem; font-size: .82rem; color: var(--muted); max-width: 46rem; }
    .formula {
      margin: 0 0 1.1rem; font-size: .8rem; font-family: ui-monospace, Menlo, monospace;

    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    .scenario {
      display: inline-flex; margin: 1.25rem 0 0; border: 1px solid var(--border);
      border-radius: .65rem; overflow: hidden; background: var(--card); flex-wrap: wrap;
    }
    .scenario button {
      border: 0; background: transparent; padding: .65rem 1rem; font: inherit;
      font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .scenario button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .shock-banner {
      margin: 1rem 0 0; padding: .85rem 1.05rem; border-radius: .65rem;
      border: 1px solid #c5d4a8; background: #f0f5e6; font-size: .88rem; color: var(--ok); display: none;
    }

    .shock-banner ul { margin: .4rem 0 0; padding-left: 1.15rem; }

      font-size: .86rem; color: var(--ink-soft); display: none;

    .cap-explain { margin: .35rem 0 0; font-size: .82rem; color: var(--muted); max-width: 40rem; }
  </style>
</head>

(function () {
  var I18N = {

  (function initPresetFromUrl() {

    return pack[key] != null ? pack[key] : (I18N.de[key] || key);
  }

  }
  function fmt(n, unit) {
    if (n == null || isNaN(n)) return "—";
    var s = Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1);
    return s + " " + unit;
  }

  function allocate() {
    var stock = Object.assign({}, STOCK0);
    var grantA = {}, grantB = {};
    ITEMS.forEach(function (it) {
      grantA[it.key] = 0;
      grantB[it.key] = 0;
    });

    if (mode === "fair") {
      ["formula", "diapers"].forEach(function (k) {
        var want = A_REQ[k] || 0;
        var g = Math.min(want, A_CAP[k] || 0, stock[k]);
        grantA[k] = g;
        stock[k] -= g;
      });
      ITEMS.forEach(function (it) {
        var k = it.key;
        if (k === "formula" || k === "diapers") return;
        var aWant = Math.min(A_REQ[k] || 0, A_CAP[k] || 0);
        var bWant = Math.min(B_REQ[k] || 0, B_CAP[k] || 0);
        var aG = Math.min(aWant, stock[k]);
        grantA[k] = aG;
        stock[k] -= aG;
        var bG = Math.min(bWant, stock[k]);
        grantB[k] = bG;
        stock[k] -= bG;
      });
    } else {
      ITEMS.forEach(function (it) {
        var k = it.key;
        var bWant = B_REQ[k] || 0;
        var bG = Math.min(bWant, stock[k]);
        grantB[k] = bG;
        stock[k] -= bG;
      });
      ITEMS.forEach(function (it) {
        var k = it.key;
        var aWant = A_REQ[k] || 0;
        var aG = Math.min(aWant, stock[k]);
        grantA[k] = aG;
        stock[k] -= aG;
      });
    }
    return { stock: stock, grantA: grantA, grantB: grantB };
  }

  }

    document.getElementById("reserve-note").classList.toggle("show", isMarkt);
    document.getElementById("page-h1").textContent = isMarkt ? t("h1_markt") : t("h1_knapp");
    document.getElementById("demo-main").textContent = isMarkt ? t("lead_markt") : t("lead_knapp");
    document.getElementById("try-hint").innerHTML = "<strong>" + (isMarkt ? t("hint_markt") : t("hint_knapp")) + "</strong>";
    document.title = isMarkt ? t("title_markt") : t("title_knapp");

    var r = allocate();
    var callout = document.getElementById("callout");
    var flourTaken = Math.round((STOCK0.wheat_flour - r.stock.wheat_flour) * 10) / 10;
    if (mode === "fair") {
      callout.className = "callout fair";
      callout.textContent = isMarkt ? t("call_fair_markt") : t("call_fair_knapp");
    } else {
      callout.className = "callout first";
      if (isMarkt) {
        callout.textContent = t("call_first_markt").replace("{n}", String(flourTaken));
      } else {
        callout.textContent = t("call_first_knapp");
      }
    }

    var ticker = document.getElementById("ticker");
    var ricePct = Math.round((r.stock.rice / STOCK0.rice) * 100);
    ticker.innerHTML = "";
    [
      ["wheat_flour", r.stock.wheat_flour],
      ["rice", r.stock.rice],
      ["formula", r.stock.formula]
    ].forEach(function (pair) {
      var it = ITEMS.find(function (x) { return x.key === pair[0]; });
      var chip = document.createElement("span");
      chip.className = "chip";
      var left = pair[1];
      var highlight = left <= 0 || (pair[0] === "rice" && ricePct <= 40);
      chip.innerHTML = itemLabel(it.key) + " · " + (highlight ? "<strong>" : "") + fmt(left, it.unit) + (pair[0] === "rice" ? " (" + ricePct + "%)" : "") + (highlight ? "</strong>" : "") + " " + t("left_word");
      ticker.appendChild(chip);
    });

    function fillTable(id, req, grant, cap) {
      var tb = document.getElementById(id);
      tb.innerHTML = "";
      ITEMS.forEach(function (it) {
        var rq = req[it.key];
        var cp = cap[it.key];
        if (rq == null && (grant[it.key] || 0) === 0 && id === "table-b" && (it.key === "formula" || it.key === "diapers")) return;
        if (rq == null) rq = 0;
        if (rq === 0 && (grant[it.key] || 0) === 0 && id === "table-b") return;
        var tr = document.createElement("tr");
        var g = grant[it.key] || 0;
        var gClass = g <= 0 && rq > 0 ? "num zero" : "num granted";
        var capCell = cp == null ? "—" : fmt(cp, it.unit);
        tr.innerHTML = "<td>" + itemLabel(it.key) + "</td><td class='num'>" + fmt(rq, it.unit) + "</td><td class='cap'>" + capCell + "</td><td class='" + gClass + "'>" + fmt(g, it.unit) + "</td>";
        tb.appendChild(tr);
      });
    }
    fillTable("table-a", A_REQ, r.grantA, A_CAP);
    fillTable("table-b", B_REQ, r.grantB, B_CAP);

    var ts = document.getElementById("table-stock");
    ts.innerHTML = "";
    ITEMS.forEach(function (it) {
      var left = r.stock[it.key];
      var tr = document.createElement("tr");
      var cls = left <= 0 ? "num zero" : "num";
      tr.innerHTML = "<td>" + itemLabel(it.key) + "</td><td class='num'>" + fmt(STOCK0[it.key], it.unit) + "</td><td class='" + cls + "'>" + fmt(left, it.unit) + "</td>";
      ts.appendChild(tr);
    });
  }

  function setMode(m) {
    mode = m;
    document.getElementById("mode-fair").setAttribute("aria-pressed", m === "fair" ? "true" : "false");
    document.getElementById("mode-first").setAttribute("aria-pressed", m === "first" ? "true" : "false");
    render();
  }

  function setScenario(s) {
    scenario = s;
    STOCK0 = Object.assign({}, s === "markt" ? STOCK_MARKT : STOCK_KNAPP);
    document.getElementById("scen-knapp").setAttribute("aria-pressed", s === "knapp" ? "true" : "false");
    document.getElementById("scen-markt").setAttribute("aria-pressed", s === "markt" ? "true" : "false");
    render();
  }

  function setLang(l) {
    if (!I18N[l]) l = "en";
    curLang = l;
    body.setAttribute("data-lang", l);
    document.documentElement.lang = l === "uk" ? "uk" : l;
    document.querySelectorAll("[data-lang-btn]").forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang-btn") === l ? "true" : "false");
    });
    render();
  }

  document.getElementById("mode-fair").addEventListener("click", function () { setMode("fair"); });
  document.getElementById("mode-first").addEventListener("click", function () { setMode("first"); });
  document.getElementById("scen-knapp").addEventListener("click", function () { setScenario("knapp"); });
  document.getElementById("scen-markt").addEventListener("click", function () { setScenario("markt"); });
  document.querySelectorAll("[data-lang-btn]").forEach(function (btn) {
    btn.addEventListener("click", function () { setLang(btn.getAttribute("data-lang-btn")); });
  });
  document.getElementById("btn-reset").addEventListener("click", function () { setScenario(scenario); setMode(mode); });

  setLang(curLang);
  setScenario(scenario);
  setMode(mode);
})();
  </script>
</body>
</html>
