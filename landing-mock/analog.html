<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodAllo — Ohne Smartphone</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="description" content="Schalter, Nachbar, Papiercode — gleiche Höchstanteile ohne Smartphone." />
  <meta name="theme-color" content="#F6A959" />
  <style>
    :root {
      --ink: #1c1a16; --ink-soft: #3a342c; --muted: #6b6358;
      --olive: #5c6b3a; --olive-deep: #45522c; --primary: #e8943a;
      --paper: #f7f1e6; --paper-deep: #ebe3d4; --card: #fffdf8;
      --border: #e0d6c6; --ok: #3f6212;
      --shadow: 0 0 0 1px rgba(28,26,22,.06), 0 8px 24px rgba(28,26,22,.06);
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .mock-banner { background: #2f3a22; color: #e8efd8; font-size: .85rem; padding: .6rem 1.25rem; text-align: center; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
    a { color: var(--olive); }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 0; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; text-decoration: none; color: var(--ink); }
    .logo-img { height: 2rem; width: auto; display: block; }
    .nav { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .nav a { font-size: .875rem; color: var(--muted); text-decoration: none; margin-left: .35rem; }
    .nav a:hover { color: var(--ink); }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: .5rem; overflow: hidden; background: var(--card); }
    .lang button { border: 0; background: transparent; padding: .35rem .5rem; font: inherit; font-size: .72rem; font-weight: 700; color: var(--muted); cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .badge { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--olive); margin: 0 0 .75rem; }
    h1 { font-family: var(--font); font-weight: 500; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.02em; line-height: 1.15; margin: .4rem 0 0; }
    .lead { margin: .85rem 0 1.5rem; color: var(--ink-soft); }
    ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }
    ol.steps li {
      counter-increment: step; position: relative;
      background: var(--card); border: 1px solid var(--border); border-radius: .65rem;
      padding: 1rem 1rem 1rem 3.1rem; margin: 0 0 .75rem; box-shadow: var(--shadow);
    }
    ol.steps li::before {
      content: counter(step); position: absolute; left: .85rem; top: .95rem;
      width: 1.6rem; height: 1.6rem; border-radius: 999px; background: var(--olive); color: #f4f7ec;
      font-size: .8rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .rule {
      margin: 1.5rem 0; padding: 1rem 1.1rem; border-radius: .65rem;
      background: #f0f5e6; border: 1px solid #c5d4a8; color: var(--ok); font-size: .95rem;
    }
    .note { font-size: .85rem; color: var(--muted); margin-top: 2rem; }
    .cta { display: inline-block; margin-top: 1.25rem; padding: .7rem 1.1rem; border-radius: .55rem;
      background: var(--olive); color: #f4f7ec; text-decoration: none; font-weight: 600; font-size: .9rem; }
    .cta:hover { background: var(--olive-deep); }
    :focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
  </style>
</head>
<body data-lang="de">
  <div class="mock-banner" data-i18n="banner"></div>
  <div class="wrap">
    <header>
      <a class="brand" href="index.html"><img class="logo-img" src="logo-header.png" alt="FoodAllo" width="156" height="48" /></a>
      <nav class="nav" aria-label="Navigation">
        <a href="index.html" data-i18n="nav_start"></a>
        <a href="demo.html?preset=markt" data-i18n="nav_demo"></a>
        <a href="eliminationsmaschine.html" data-i18n="nav_elim"></a>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang-btn="de" aria-pressed="true">DE</button>
          <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
          <button type="button" data-lang-btn="fr" aria-pressed="false">FR</button>
          <button type="button" data-lang-btn="es" aria-pressed="false">ES</button>
          <button type="button" data-lang-btn="uk" aria-pressed="false">UK</button>
        </div>
      </nav>
    </header>

    <main id="main">
      <p class="badge" data-i18n="badge"></p>
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="rule" role="note" data-i18n="rule"></div>
      <ol class="steps">
        <li><strong data-i18n="s1_t"></strong> — <span data-i18n="s1_b"></span></li>
        <li><strong data-i18n="s2_t"></strong> — <span data-i18n="s2_b"></span></li>
        <li><strong data-i18n="s3_t"></strong> — <span data-i18n="s3_b"></span></li>
      </ol>
      <a class="cta" href="demo.html?preset=markt" data-i18n="cta"></a>
      <p class="note" data-i18n="note"></p>
    </main>
  </div>
  <script>
(function(){
  var I18N = {"de": {"banner": "Übung / Konzept-Demo — kein Live-Behördensystem · Free · Gemeinwohl", "nav_start": "Start", "nav_demo": "Gast-Demo", "nav_elim": "Eliminationsmaschine", "badge": "Ohne Smartphone", "h1": "Drei Wege ohne Smartphone", "lead": "Gleiche Regeln wie in der App. Kein Extra-Anteil. Nur andere Wege zur Abholung.", "rule": "Eine Karte je Haushalt und Woche. Der Höchstanteil gilt überall — Schalter, Nachbar, Papiercode.", "s1_t": "Schalter", "s1_b": "Sie gehen zu einem kommunalen oder Laden-Schalter. Personal prüft den Anspruch und trägt den Höchstanteil ein.", "s2_t": "Nachbar / Vertretung", "s2_b": "Eine vertrauenswürdige Person holt für Sie ab. Dieselbe Karte — kein zweites Kontingent.", "s3_t": "Papiercode", "s3_b": "Sie erhalten einen kurzen Code auf Papier. Einmal nutzen, kurze Gültigkeit — dann Abholung wie am Schalter.", "cta": "Zur Gast-Demo (fair vs. wer zuerst kommt)", "note": "Gemeinwohl-Konzept · keine Beauftragung · Demo-Zahlen = Szenario · kein Live-System", "title": "FoodAllo — Ohne Smartphone"}, "en": {"banner": "Exercise / concept demo — not a live government system · free · public interest", "nav_start": "Home", "nav_demo": "Guest demo", "nav_elim": "Elimination engine", "badge": "No smartphone", "h1": "Three ways without a smartphone", "lead": "Same rules as in the app. No extra share. Only different pickup paths.", "rule": "One card per household per week. The maximum share applies everywhere — desk, neighbour, paper code.", "s1_t": "Desk / counter", "s1_b": "You go to a municipal or store counter. Staff checks entitlement and records the maximum share.", "s2_t": "Neighbour / proxy", "s2_b": "A trusted person picks up for you. Same card — no second quota.", "s3_t": "Paper code", "s3_b": "You get a short code on paper. One-time use, short validity — then pickup like at the desk.", "cta": "To guest demo (fair vs first come)", "note": "Public-interest concept · no mandate · demo numbers = scenario · not a live system", "title": "FoodAllo — No smartphone"}, "fr": {"banner": "Exercice / démo concept — pas un système public en production · gratuit · bien commun", "nav_start": "Accueil", "nav_demo": "Démo invitée", "nav_elim": "Machine d'élimination", "badge": "Sans smartphone", "h1": "Trois voies sans smartphone", "lead": "Mêmes règles que dans l'app. Pas de part supplémentaire. Seulement d'autres chemins de retrait.", "rule": "Une carte par foyer et par semaine. La part maximale s'applique partout — guichet, voisin, code papier.", "s1_t": "Guichet", "s1_b": "Vous allez à un guichet communal ou magasin. Le personnel vérifie le droit et enregistre la part maximale.", "s2_t": "Voisin / représentant", "s2_b": "Une personne de confiance retire pour vous. Même carte — pas de second quota.", "s3_t": "Code papier", "s3_b": "Vous recevez un code court sur papier. Usage unique, courte validité — puis retrait comme au guichet.", "cta": "Vers la démo (équitable vs premier arrivé)", "note": "Concept bien commun · pas de mandat · chiffres = scénario · pas un système live", "title": "FoodAllo — Sans smartphone"}, "es": {"banner": "Ejercicio / demo conceptual — no es un sistema público en vivo · gratis · bien común", "nav_start": "Inicio", "nav_demo": "Demo de invitado", "nav_elim": "Máquina de eliminación", "badge": "Sin smartphone", "h1": "Tres vías sin smartphone", "lead": "Mismas reglas que en la app. Sin cuota extra. Solo otras formas de recogida.", "rule": "Una tarjeta por hogar y semana. La cuota máxima vale en todas partes — ventanilla, vecino, código en papel.", "s1_t": "Ventanilla", "s1_b": "Va a una ventanilla municipal o de tienda. El personal comprueba el derecho y anota la cuota máxima.", "s2_t": "Vecino / representante", "s2_b": "Una persona de confianza recoge por usted. Misma tarjeta — sin segundo cupo.", "s3_t": "Código en papel", "s3_b": "Recibe un código corto en papel. Un solo uso, corta validez — luego recogida como en ventanilla.", "cta": "A la demo (justo vs quien llega primero)", "note": "Concepto de bien común · sin mandato · cifras = escenario · no es un sistema en vivo", "title": "FoodAllo — Sin smartphone"}, "uk": {"banner": "Вправа / концепт-демо — не жива державна система · безкоштовно · суспільне благо", "nav_start": "Головна", "nav_demo": "Гостьове демо", "nav_elim": "Машина усунення", "badge": "Без смартфона", "h1": "Три шляхи без смартфона", "lead": "Ті самі правила, що в застосунку. Без додаткової частки. Лише інші шляхи отримання.", "rule": "Одна картка на родину і тиждень. Максимальна частка діє всюди — каса, сусід, паперовий код.", "s1_t": "Каса / вікно", "s1_b": "Ви йдете до муніципальної або магазинної каси. Персонал перевіряє право і вносить максимальну частку.", "s2_t": "Сусід / представник", "s2_b": "Довірена особа отримує за вас. Та сама картка — без другої квоти.", "s3_t": "Паперовий код", "s3_b": "Ви отримуєте короткий код на папері. Одноразово, короткий термін — далі отримання як на касі.", "cta": "До демо (справедливо vs хто перший)", "note": "Концепт суспільного блага · немає доручення · цифри = сценарій · не жива система", "title": "FoodAllo — Без смартфона"}};
  var cur = "de";
  var q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) cur = q;
  function t(k){ return (I18N[cur]||I18N.de)[k] || I18N.de[k] || k; }
  function apply(){
    document.body.setAttribute("data-lang", cur);
    document.documentElement.lang = cur === "uk" ? "uk" : cur;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-lang-btn]").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn")===cur ? "true":"false");
    });
  }
  document.querySelectorAll("[data-lang-btn]").forEach(function(b){
    b.addEventListener("click", function(){ cur = b.getAttribute("data-lang-btn"); apply(); });
  });
  apply();
})();
  </script>
</body>
</html>
